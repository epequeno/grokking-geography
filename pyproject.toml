[project]
name = "grokking-geography"
version = "0.1.0"
description = "Grokking Geography: surgical freezing, label noise, and task taxonomy experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "einops>=0.7.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
]
